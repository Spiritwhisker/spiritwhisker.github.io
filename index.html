<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Please stop wasting your time.</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      button {
        position: relative;
      }

      button::after {
        content: "";
        position: absolute;
        inset: -0.4rem;
        border: 2px solid currentColor;
        border-radius: inherit;
        opacity: 0;
        pointer-events: none;
      }

      button.is-pressed::after {
        animation: button-ring 900ms ease-out forwards;
      }

      @keyframes button-ring {
        from {
          opacity: 0.9;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(1.5);
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <p class="eyebrow">Stop wasting your time v0.1.15 (so I know when it updates)</p>
      <h1>hehehe</h1>
      <p class="intro">
        Stop wasting your time...<br />Life is finite.
      </p>

      <button id="startHere" type="button">Start Here</button>
      <button id="theWeirdAndWorryingAboutUsButton" type="button">About Us</button>
    </main>

    <script src="script.js"></script>
    <script>
      document.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          button.classList.remove("is-pressed");
          void button.offsetWidth;
          button.classList.add("is-pressed");
          setTimeout(() => button.classList.remove("is-pressed"), 900);
        });
      });
    </script>
  </body>
</html>
