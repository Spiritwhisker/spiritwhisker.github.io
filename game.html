<!DOCTYPE html>
<html lang="en">
  <head>
    <!--NOTE!!! THIS IS A DINO GAME THAT IDK HOW COPYRIGHTS REALLY WORK
    BUT THIS IS BASICALLY A COPY! I ADDED A FEW EXTRA THINGS TO MAKE IT LOOK INTERESTING
    BUT LIKE OKAY??-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dino Runner because you did good and I wanna reward you.</title>
    <style>
      :root {
        --blackish: #1d2a2e;
        --grayish: #607174;
        --paper: #f6f3ed;
        --accent: #e8774e;
        --accent-hover: #d96845;
        --accent-dark: #b84f2e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--blackish);
        background: radial-gradient(circle at top left, #fffaf0, var(--paper) 55%, #dce8e2);
        font-family: Arial, "Verdana", sans-serif;
      }

      .game-shell {
        width: min(100%, 860px);
        padding: clamp(20px, 4vw, 36px) clamp(18px, 3vw, 30px) 10px;
        border: 1px solid rgba(29, 42, 46, 0.12);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.58);
        box-shadow: 0 24px 60px rgba(29, 42, 46, 0.12);
      }

      canvas {
        display: block;
        width: 100%;
        max-width: 800px;
        height: auto;
        background: linear-gradient(#fffaf0, #edf3ee);
        border: 1px solid rgba(29, 42, 46, 0.12);
        border-radius: 6px;
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 4px 0;
        color: var(--grayish);
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .hud #score {
        color: var(--accent-dark);
      }

      .hint {
        font-size: 12px;
        color: var(--grayish);
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <canvas id="game" width="800" height="220" aria-label="Google Dino style running game"></canvas>
      <div class="hud">
        <span>Press space to jump or you will hit something and die :(</span>
        <span id="score">Score: 0</span>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreText = document.getElementById('score');

      const groundY = canvas.height - 28;
      const gravity = 0.72;
      const baseSpeed = 5.5;

      let player;
      let obstacles = [];
      let clouds = [];
      let animationId;
      let lastTime = 0;
      let score = 0;
      let spawnTimer = 0;
      let gameOver = false;

      function resetGame() {
        player = {
          x: 70,
          y: groundY - 34,
          w: 30,
          h: 34,
          vy: 0,
          jumpReady: true,
        };

        obstacles = [];
        clouds = [
          { x: 100, y: 40, w: 46, h: 18 },
          { x: 260, y: 58, w: 52, h: 20 },
          { x: 520, y: 46, w: 48, h: 18 },
          { x: 700, y: 60, w: 50, h: 18 },
        ];

        score = 0;
        spawnTimer = 0;
        gameOver = false;
        scoreText.textContent = 'Score: 0';
      }

      function jump() {
        if (gameOver) {
          resetGame();
          return;
        }

        if (player.y >= groundY - player.h - 0.1) {
          player.vy = -13;
        }
      }

      function makeObstacle() {
        const typeRoll = Math.random();
        const width = typeRoll > 0.55 ? 26 : 18;
        const height = typeRoll > 0.55 ? 42 : 32;

        obstacles.push({
          x: canvas.width + 20,
          y: groundY - height,
          w: width,
          h: height,
        });
      }

      function update(dt) {
        if (gameOver) {
          return;
        }

        score += dt * 0.12;
        scoreText.textContent = `Score: ${Math.floor(score)}`;

        player.vy += gravity * dt;
        player.y += player.vy * dt;

        if (player.y >= groundY - player.h) {
          player.y = groundY - player.h;
          player.vy = 0;
        }

        clouds.forEach((cloud) => {
          cloud.x -= (baseSpeed * 0.35) * dt;
          if (cloud.x < -cloud.w - 20) {
            cloud.x = canvas.width + 40;
            cloud.y = 25 + Math.random() * 55;
          }
        });

        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          makeObstacle();
          const gap = 60 + Math.random() * 75;
          spawnTimer = gap;
        }

        const speed = baseSpeed + Math.min(score / 60, 7);
        obstacles.forEach((obstacle) => {
          obstacle.x -= speed * dt;
        });

        while (obstacles.length && obstacles[0].x + obstacles[0].w < -10) {
          obstacles.shift();
        }

        const dinoBox = {
          x: player.x + 6,
          y: player.y + 4,
          w: player.w - 10,
          h: player.h - 4,
        };

        for (const obstacle of obstacles) {
          const hit =
            dinoBox.x < obstacle.x + obstacle.w &&
            dinoBox.x + dinoBox.w > obstacle.x &&
            dinoBox.y < obstacle.y + obstacle.h &&
            dinoBox.y + dinoBox.h > obstacle.y;

          if (hit) {
            gameOver = true;
            break;
          }
        }
      }

      function drawGround() {
        ctx.fillStyle = '#7a7a7a';
        ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

        ctx.strokeStyle = '#909090';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(canvas.width, groundY);
        ctx.stroke();

        ctx.strokeStyle = '#8a8a8a';
        for (let x = 0; x < canvas.width + 40; x += 20) {
          ctx.beginPath();
          ctx.moveTo(x, groundY + 6);
          ctx.lineTo(x + 10, groundY + 6);
          ctx.stroke();
        }
      }

      function drawCloud(cloud) {
        ctx.fillStyle = '#dfe5eb';
        ctx.beginPath();
        ctx.arc(cloud.x, cloud.y, 14, 0, Math.PI * 2);
        ctx.arc(cloud.x + 18, cloud.y - 4, 16, 0, Math.PI * 2);
        ctx.arc(cloud.x + 34, cloud.y, 14, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawPlayer() {
        ctx.fillStyle = '#1e1e1e';
        ctx.fillRect(player.x + 8, player.y + 14, player.w - 16, player.h - 16);
        ctx.fillRect(player.x + 4, player.y + 18, 6, 10);
        ctx.fillRect(player.x + 20, player.y + 18, 6, 10);

        ctx.fillRect(player.x + 12, player.y + 8, 10, 8);
        ctx.fillRect(player.x + 18, player.y + 8, 8, 8);

        ctx.fillStyle = '#f7f7f7';
        ctx.fillRect(player.x + 18, player.y + 10, 3, 3);
      }

      function drawObstacle(obstacle) {
        ctx.fillStyle = '#2d7b42';
        ctx.fillRect(obstacle.x + 6, obstacle.y + 8, obstacle.w - 12, obstacle.h - 8);
        ctx.fillRect(obstacle.x + 2, obstacle.y + 14, 8, obstacle.h - 14);
        ctx.fillRect(obstacle.x + obstacle.w - 10, obstacle.y + 14, 8, obstacle.h - 14);
        ctx.fillStyle = '#1e5a2c';
        ctx.fillRect(obstacle.x + 8, obstacle.y + 2, 8, 8);
        ctx.fillRect(obstacle.x + obstacle.w - 16, obstacle.y + 2, 8, 8);
      }

      function drawGameOver() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#222';
        ctx.font = 'bold 28px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 12);

        ctx.font = '18px Arial';
        ctx.fillText('Press space or ↑ to restart', canvas.width / 2, canvas.height / 2 + 22);
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        clouds.forEach(drawCloud);
        drawGround();
        obstacles.forEach(drawObstacle);
        drawPlayer();

        if (gameOver) {
          drawGameOver();
        }
      }

      function loop(timestamp) {
        const dt = Math.min((timestamp - lastTime) / 16.666, 2.2) || 1;
        lastTime = timestamp;

        update(dt);
        render();
        animationId = requestAnimationFrame(loop);
      }

      document.addEventListener('keydown', (event) => {
        if (['Space', 'ArrowUp', 'KeyW'].includes(event.code)) {
          event.preventDefault();
          jump();
        }
      });

      document.addEventListener('pointerdown', () => {
        jump();
      });

      resetGame();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
