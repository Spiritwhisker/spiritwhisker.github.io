<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Work Timer! Focus Well Now!</title>
	<link rel="stylesheet" href="style.css">
	<style>
		* { box-sizing: border-box; }
		.timer {display: grid; place-items: center; margin: 1rem auto;}
		#display {font-size: 4rem; font-variant-numeric: tabular-nums; letter-spacing: 0.04em;}
		.actions {display: flex; justify-content: center; gap: 0.75rem;}
	</style>
</head>
<body>
	<main>
		<h4>Work Timer! Now focus well to get a dino game.</h4> <!-- Yay! -->
		<div class="timer" id="timer" aria-live="polite">
			<strong id="display">25:00</strong>
		</div>
		<div class="actions"><button class="primary" id="start">Start</button></div>
	</main>
	<script>
		const display = document.getElementById('display');
		const urlParams = new URLSearchParams(window.location.search);
		const durationMinutes = Math.max(1, Math.min(90, Number(urlParams.get('duration')) || 25));
		let seconds = durationMinutes * 60;
		let running = false;
		let interval;
		
		function render() {
			const min = Math.floor(seconds / 60);
			const sec = seconds % 60;
			display.textContent = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
			document.title = `${display.textContent} - Work Timer`;
		}
		
		function finish() {
			running = false;
			clearInterval(interval);
			start.textContent = 'Start';
			window.location.href = 'review.html';
		}
		
		function tick() {
			if (--seconds <= 0) {
				seconds = 0;
				render();
				finish();
				return;
			}
			render();
		}
		
		const start = document.getElementById('start');
		start.onclick = () => {
			if (running) {
				running = false;
				clearInterval(interval);
				start.textContent = 'Resume';
			} else {
				running = true;
				start.textContent = 'Pause';
				interval = setInterval(tick, 1000);
			}
		};
		
		render();
	</script>
</body>
</html>
