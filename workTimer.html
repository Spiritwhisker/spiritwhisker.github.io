<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Work Timer</title>
	<style>
		:root { color-scheme: dark; --accent: #8b5cf6; --bg: #111827; --panel: #1f2937; --muted: #9ca3af; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: linear-gradient(135deg, #111827, #312e81); color: #f9fafb; }
		main { width: min(92vw, 460px); padding: 2.25rem; text-align: center; background: rgba(31, 41, 55, .94); border: 1px solid rgba(255,255,255,.1); border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
		h1 { margin: 0 0 .4rem; font-size: 2rem; } p { color: var(--muted); margin: 0 0 1.5rem; }
		.modes { display: flex; gap: .5rem; margin-bottom: 2rem; }
		button { border: 0; border-radius: 10px; padding: .8rem 1.1rem; color: inherit; background: #374151; font: inherit; font-weight: 600; cursor: pointer; transition: .2s; }
		button:hover { filter: brightness(1.15); } button:disabled { opacity: .55; cursor: not-allowed; }
		.mode { flex: 1; } .mode.active { background: var(--accent); }
		.timer { position: relative; display: grid; place-items: center; width: 260px; height: 260px; margin: 0 auto 2rem; border-radius: 50%; background: conic-gradient(var(--accent) var(--progress, 0%), #374151 0); }
		.timer::before { content: ""; position: absolute; inset: 11px; border-radius: 50%; background: var(--panel); }
		#display, .timer-label { position: relative; z-index: 1; } #display { font-size: 4rem; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
		.timer-label { display: block; color: var(--muted); font-size: .9rem; margin-top: -.5rem; }
		.actions { display: flex; justify-content: center; gap: .75rem; } .primary { min-width: 120px; background: var(--accent); }
		.settings { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-top: 2rem; text-align: left; }
		label { color: var(--muted); font-size: .85rem; } input { width: 100%; margin-top: .35rem; padding: .65rem; border: 1px solid #4b5563; border-radius: 8px; background: #111827; color: white; font: inherit; }
	</style>
</head>
<body>
	<main>
		<h1>Work Timer</h1>
		<p id="status">Stay focused and take regular breaks.</p>
		<div class="modes" role="tablist" aria-label="Timer mode">
			<button class="mode active" data-mode="work">Work</button>
			<button class="mode" data-mode="break">Break</button>
		</div>
		<div class="timer" id="timer" aria-live="polite">
			<div><strong id="display">25:00</strong><span class="timer-label" id="timerLabel">Work session</span></div>
		</div>
		<div class="actions"><button class="primary" id="start">Start</button><button id="reset">Reset</button></div>
		<div class="settings">
			<label>Work minutes<input id="workMinutes" type="number" min="1" max="180" value="25"></label>
			<label>Break minutes<input id="breakMinutes" type="number" min="1" max="60" value="5"></label>
		</div>
	</main>
	<script>
		const display = document.querySelector('#display'), timer = document.querySelector('#timer');
		const start = document.querySelector('#start'), reset = document.querySelector('#reset');
		const status = document.querySelector('#status'), label = document.querySelector('#timerLabel');
		const inputs = { work: document.querySelector('#workMinutes'), break: document.querySelector('#breakMinutes') };
		let mode = 'work', seconds = 1500, running = false, interval;
		const duration = () => Number(inputs[mode].value || 1) * 60;
		function render() { const min = Math.floor(seconds / 60), sec = seconds % 60; display.textContent = `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; timer.style.setProperty('--progress', `${100 - seconds / duration() * 100}%`); label.textContent = mode === 'work' ? 'Work session' : 'Break time'; document.title = `${display.textContent} · ${mode}`; }
		function finish() { running = false; clearInterval(interval); start.textContent = 'Start'; status.textContent = mode === 'work' ? 'Great work! Time for a break.' : 'Break over. Ready to focus?'; }
		function tick() { if (--seconds <= 0) { seconds = 0; render(); finish(); return; } render(); }
		start.onclick = () => { if (running) { running = false; clearInterval(interval); start.textContent = 'Resume'; } else { running = true; start.textContent = 'Pause'; interval = setInterval(tick, 1000); } };
		reset.onclick = () => { clearInterval(interval); running = false; seconds = duration(); start.textContent = 'Start'; status.textContent = 'Stay focused and take regular breaks.'; render(); };
		document.querySelectorAll('.mode').forEach(button => button.onclick = () => { mode = button.dataset.mode; document.querySelectorAll('.mode').forEach(b => b.classList.toggle('active', b === button)); reset.onclick(); });
		Object.values(inputs).forEach(input => input.onchange = () => { if (!running) { seconds = duration(); render(); } });
		render();
	</script>
</body>
</html>
