<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stop Wasting Your Time</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, sans-serif;
      }

      /* Use the site's theme by default. When a rest timer is active, add .rest-mode to body */
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      body.rest-mode {
        /* Rest mode uses a dark background so the page is visually distinct */
        background: #111827;
        color: #f9fafb;
      }

      .app {
        width: min(92vw, 720px);
        padding: 2rem 1.25rem 3rem;
      }

      .hero {
        margin-bottom: 1rem;
      }

      .eyebrow {
        margin: 0 0 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 0.72rem;
        opacity: 0.75;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 4rem);
      }

      .status-card,
      .timer-card,
      .history-card {
        margin-top: 1.25rem;
        padding: 1rem 1.25rem;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 0.75rem;
        background: rgba(255, 255, 255, 0.02);
      }

      .status-score {
        font-size: 2rem;
        font-weight: 700;
      }

      .status-text {
        margin: 0.5rem 0 0;
      }

      .timer-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1rem;
        margin-top: 1rem;
      }

      .field {
        display: grid;
        gap: 0.4rem;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.65rem 0.7rem;
        border-radius: 0.5rem;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(0, 0, 0, 0.15);
        color: inherit;
      }

      .timer-display {
        margin-top: 1rem;
        font-size: clamp(1.8rem, 5vw, 2.6rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .button-row {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }

      button {
        padding: 0.7rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: #4f46e5;
        color: white;
        cursor: pointer;
      }

      button.secondary {
        background: rgba(255, 255, 255, 0.14);
      }

      #todaySessions {
        margin: 0.75rem 0 0;
        padding-left: 1.25rem;
      }

      #noSessions {
        margin: 0.75rem 0 0;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <p class="eyebrow">Daily progress</p>
        <h1><span id="dailyScore">50</span></h1>
      </header>

      <section class="status-card" aria-live="polite">
        <div class="status-score" id="scoreDisplay">50</div>
        <p class="status-text" id="dailyQualityText">Balanced</p>
      </section>

      <section class="timer-card" aria-label="Work and rest timer">
        <div class="timer-header">
          <h2>Focus timer</h2>
        </div>

        <div class="timer-grid">
          <label class="field">
            <span>Work</span>
            <input id="workDuration" type="number" min="1" max="480" value="25" />
          </label>

          <label class="field">
            <span>Rest</span>
            <input id="restDuration" type="number" min="1" max="60" value="5" />
          </label>
        </div>

        <div class="timer-display" id="workTimerDisplay" role="timer" aria-live="polite">25:00</div>

        <div class="button-row">
          <button id="startWorkTimer" type="button">Start work</button>
          <button id="startRestTimer" type="button" class="secondary">Start rest</button>
        </div>
      </section>

      <section class="history-card" aria-labelledby="sessionHistoryTitle">
        <h2 id="sessionHistoryTitle">Your sessions today</h2>
        <ul id="todaySessions"></ul>
        <p id="noSessions">No sessions yet today.</p>
      </section>
    </main>

    <script src="script.js"></script>
    <script>
      (() => {
        const sessionKey = "stopWastingYourTimeBecauseYouAreSoBadSessions";
        const sessionsList = document.getElementById("todaySessions");
        const noSessions = document.getElementById("noSessions");

        function getTodaySessions() {
          const now = new Date();
          const todayKey = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;

          try {
            const saved = JSON.parse(localStorage.getItem(sessionKey) || "{}");
            return saved.date === todayKey && Array.isArray(saved.sessions) ? saved.sessions : [];
          } catch {
            return [];
          }
        }

        function renderSessions() {
          const sessions = getTodaySessions();
          sessionsList.replaceChildren();

          sessions.forEach((session) => {
            const item = document.createElement("li");
            item.textContent = `Started at ${new Date(session).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
            sessionsList.appendChild(item);
          });

          noSessions.hidden = sessions.length > 0;
        }

        // expose so other script blocks can update and re-render
        window.renderSessions = renderSessions;
        window.sessionKey = sessionKey;

        renderSessions();
      })();

      (() => {
        const scoreElement = document.getElementById("dailyScore");
        const scoreDisplay = document.getElementById("scoreDisplay");
        const qualityElement = document.getElementById("dailyQualityText");

        function updateQuality() {
          const rawText = scoreElement.textContent.trim();
          const score = Number(rawText);

          if (!Number.isFinite(score)) {
            scoreDisplay.textContent = "50";
            qualityElement.textContent = "Balanced";
            return;
          }

          scoreDisplay.textContent = String(score);

          if (score > 80) qualityElement.textContent = "Overproductive! Very berry well.";
          else if (score >= 70) qualityElement.textContent = "Very productive";
          else if (score >= 60) qualityElement.textContent = "Productive";
          else if (score >= 50) qualityElement.textContent = "Balanced";
          else if (score >= 40) qualityElement.textContent = "A little underactive";
          else if (score >= 20) qualityElement.textContent = "Underactive";
          else qualityElement.textContent = "Very underactive—do better :/";
        }

        const observer = new MutationObserver(updateQuality);
        observer.observe(scoreElement, {
          childList: true,
          characterData: true,
          subtree: true
        });

        updateQuality();
      })();

      (() => {
        const workDurationInput = document.getElementById("workDuration");
        const restDurationInput = document.getElementById("restDuration");
        const startWorkButton = document.getElementById("startWorkTimer");
        const startRestButton = document.getElementById("startRestTimer");
        const display = document.getElementById("workTimerDisplay");
        let intervalId = null;

        function formatTime(totalSeconds) {
          const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
          const seconds = String(totalSeconds % 60).padStart(2, "0");
          return `${minutes}:${seconds}`;
        }

        function recordSessionStart() {
          try {
            const now = new Date();
            const todayKey = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
            const saved = JSON.parse(localStorage.getItem(window.sessionKey) || "{}");
            if (saved.date !== todayKey || !Array.isArray(saved.sessions)) {
              saved.date = todayKey;
              saved.sessions = [];
            }
            saved.sessions.push(Date.now());
            localStorage.setItem(window.sessionKey, JSON.stringify(saved));
            // re-render the list if available
            if (typeof window.renderSessions === 'function') window.renderSessions();
          } catch (e) {
            console.error('Failed to record session start', e);
          }
        }

        function runTimer(durationMinutes, type) {
          clearInterval(intervalId);
          const initialSeconds = Math.max(1, Math.min(480, Number(durationMinutes) || 25)) * 60;
          let seconds = initialSeconds;

          // toggle rest-mode class so background reflects rest state
          if (type === 'rest') document.body.classList.add('rest-mode');
          else document.body.classList.remove('rest-mode');

          const render = () => {
            display.textContent = formatTime(seconds);
          };

          render();

          intervalId = setInterval(() => {
            seconds -= 1;
            render();

            if (seconds <= 0) {
              clearInterval(intervalId);

              // Save timer/session info so review.html can pick it up
              try {
                localStorage.setItem('sessionDuration', String(initialSeconds));
                localStorage.setItem('timerDuration', String(initialSeconds));
                localStorage.setItem('workSessionDuration', String(initialSeconds));
              } catch (e) {
                console.error('Failed to save session duration', e);
              }

              if (type === "work") {
                // after a work session finish, go to review where the user rates the session
                window.location.href = 'review.html';
              } else {
                display.textContent = 'Rest complete!';
                // remove rest-mode shortly after rest ends
                setTimeout(() => document.body.classList.remove('rest-mode'), 1800);
              }
            }
          }, 1000);
        }

        startWorkButton.addEventListener("click", () => {
          recordSessionStart();
          runTimer(workDurationInput.value, "work");
        });

        startRestButton.addEventListener("click", () => {
          recordSessionStart();
          runTimer(restDurationInput.value, "rest");
        });

        display.textContent = formatTime(Number(workDurationInput.value || 25) * 60);
      })();
    </script>
  </body>
</html>
